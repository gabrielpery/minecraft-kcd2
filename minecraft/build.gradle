plugins {
    id 'fabric-loom' version '1.10.5'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom {
    runs {
        client {
            programArgs '--username', 'MineComeLab'
            vmArgs '--enable-native-access=ALL-UNNAMED'
            if (project.hasProperty('minecomeAimedStoneLab'))
                vmArgs '-Dminecome.aimedStoneLab=true'
            for (String suffix : ['Run','Directory']) {
                String key = 'minecomeAimedStone' + suffix
                if (project.hasProperty(key))
                    vmArgs "-Dminecome.aimedStone${suffix}=${project.property(key)}"
            }
            if (project.hasProperty('minecomeHudExportLab'))
                vmArgs '-Dminecome.hudExportLab=true'
            if (project.hasProperty('minecomeHudExportDirectory'))
                vmArgs "-Dminecome.hudExportDirectory=${project.property('minecomeHudExportDirectory')}"
            if (project.hasProperty('minecomeHudStreamLab'))
                vmArgs '-Dminecome.hudStreamLab=true'
            if (project.hasProperty('minecomeHudStreamInput'))
                vmArgs '-Dminecome.hudStreamInput=true'
            if (project.hasProperty('minecomeHudStreamLiveMouse'))
                vmArgs '-Dminecome.hudStreamLiveMouse=true'
            if (project.hasProperty('minecomeHudStreamInputFixture'))
                vmArgs '-Dminecome.hudStreamInputFixture=true'
            if (project.hasProperty('minecomeHudStreamInputPointerFixture'))
                vmArgs '-Dminecome.hudStreamInputPointerFixture=true'
            if (project.hasProperty('minecomeHudStoneBridge'))
                vmArgs '-Dminecome.hudStoneBridge=true'
            if (project.hasProperty('minecomeHudStoneFixture'))
                vmArgs '-Dminecome.hudStoneFixture=true'
            if (project.hasProperty('minecomeHudStoneLive'))
                vmArgs '-Dminecome.hudStoneLive=true'
            if (project.hasProperty('minecomeHudStreamInputDelayFixture'))
                vmArgs '-Dminecome.hudStreamInputDelayFixture=true'
            if (project.hasProperty('minecomeHudStreamBackgroundTrial'))
                vmArgs '-Dminecome.hudStreamBackgroundTrial=true'
            if (project.hasProperty('minecomeHudStreamOffscreenPresentation'))
                vmArgs '-Dminecome.hudStreamOffscreenPresentation=true'
            if (project.hasProperty('minecomeHudStreamOffscreenTrial'))
                vmArgs '-Dminecome.hudStreamOffscreenTrial=true'
            for (String suffix : ['Run','TargetPid','TargetStart','ExpiresUtcMs','Directory','Width','Height','GuiScale']) {
                String key = 'minecomeHudStream' + suffix
                if (project.hasProperty(key))
                    vmArgs "-Dminecome.hudStream${suffix}=${project.property(key)}"
            }
            if (project.hasProperty('minecomeTokenFile'))
                vmArgs "-Dminecome.tokenFile=${project.property('minecomeTokenFile')}"
            if (project.hasProperty('minecomePort'))
                vmArgs "-Dminecome.port=${project.property('minecomePort')}"
            if (project.hasProperty('minecomeExportStone'))
                vmArgs '-Dminecome.exportStoneOnStart=true'
            if (project.hasProperty('minecomeExitAfterSeconds'))
                vmArgs "-Dminecome.exitAfterSeconds=${project.property('minecomeExitAfterSeconds')}"
            if (project.hasProperty('minecomeSmokeWorld'))
                vmArgs '-Dminecome.smokeWorld=true'
            if (project.hasProperty('minecomeDynamicBridgeSmoke'))
                vmArgs '-Dminecome.dynamicBridgeSmoke=true'
            if (project.hasProperty('minecomeInteractiveStoneLab'))
                vmArgs '-Dminecome.interactiveStoneLab=true'
            if (project.hasProperty('minecomeGroundMovementLab'))
                vmArgs '-Dminecome.groundMovementLab=true'
            if (project.hasProperty('minecomeExternalInputLab'))
                vmArgs '-Dminecome.externalInputLab=true'
            if (project.hasProperty('minecomeExternalInputFixture'))
                vmArgs '-Dminecome.externalInputFixture=true'
            for (String suffix : ['File','ViewFile','PoseFile','Run','TargetPid','TargetStartFiletime']) {
                String key = 'minecomeExternalInput' + suffix
                if (project.hasProperty(key))
                    vmArgs "-Dminecome.externalInput${suffix}=${project.property(key)}"
            }
            if (project.hasProperty('minecomeGroundPatchFile'))
                vmArgs "-Dminecome.groundPatchFile=${project.property('minecomeGroundPatchFile')}"
            if (project.hasProperty('minecomeMovementTraceFile'))
                vmArgs "-Dminecome.movementTraceFile=${project.property('minecomeMovementTraceFile')}"
            if (project.hasProperty('minecomeSmokeWorldSeconds'))
                vmArgs "-Dminecome.smokeWorldSeconds=${project.property('minecomeSmokeWorldSeconds')}"
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Minecraft 1.21.1 already supplies these exact JNA libraries at runtime.
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
}
sourceSets {
    main.java.srcDir '../protocol/java/src/main/java'
    test.java.srcDir '../protocol/java/src/test/java'
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.register('protocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.protocol.ProtocolTests'
}
check.dependsOn protocolTest
tasks.register('smokeSequenceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.SmokeSequenceTests'
}
check.dependsOn smokeSequenceTest
tasks.register('stoneInputGateTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.StoneInputGateTests'
}
check.dependsOn stoneInputGateTest
tasks.register('groundPatchTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.terrain.GroundPatchTests'
}
check.dependsOn groundPatchTest
tasks.register('externalInputTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.input.ExternalInputTests'
}
tasks.register('externalInputRecordingCheck', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.minecome.input.ExternalInputRecordingCheck'
    if (project.hasProperty('minecomeInputRecording'))
        args project.property('minecomeInputRecording').toString()
}

tasks.register('externalInputFileTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.input.ExternalInputFileReaderTests'
}

tasks.register('externalInputPoseTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.input.ExternalInputPoseSinkTests'
}

tasks.register('hostViewSeedTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.input.HostViewSeedTests'
}

tasks.register('hudExportTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudExportTests'
}

tasks.register('hudStreamTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudStreamTests'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.register('hudInputTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudInputTests'
}

tasks.register('hudPointerStateTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudPointerStateTests'
}

tasks.register('hudWindowCleanupTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudWindowCleanupTests'
}

tasks.register('hudRenderTimingTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudRenderTimingTests'
}

tasks.register('hudCaptureCadenceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudCaptureCadenceTests'
}

tasks.register('hudStoneGateTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudStoneGateTests'
}

tasks.register('hudStoneProofTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudStoneProofTests'
}

tasks.register('hudStoneModeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudStoneModeTests'
}

tasks.register('hudEvidenceWriterTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudEvidenceWriterTests'
}

tasks.register('hudStreamFixture', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.minecome.hud.HudStreamFixture'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (project.hasProperty('minecomeHudStreamFixtureArgs'))
        args project.property('minecomeHudStreamFixtureArgs').toString().split('\\|', -1)
}
